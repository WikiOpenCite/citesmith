[project]
name = "citesmith"
version = "0.1.0"
description = "The processing workflow that uses citescoop to extract citations and build datasets"
authors = [
    {name = "Zoe Nickson",email = "mjn6@st-andrews.ac.uk"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click (>=8.4.2,<9.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "mariadb[binary,pool] (>=2.0.0rc2,<3.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "flask (>=3.1.3,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pylint (>=4.0.9,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "citesmith", from = "src" },
]

[tool.poetry.dependencies]
mariadb = {allow-prereleases = true}
[tool.pytest.ini_options]
pythonpath = [
  "."
]
addopts = "--cov --cov-branch --cov-report term-missing"

[tool.codespell]
skip = 'poetry.lock'
count = true
quiet-level = 3

[tool.pylint]
init-hook='import sys; sys.path.append(".")'
